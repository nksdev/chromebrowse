name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is not available on ubuntu-24.04+ runners.
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline tests
        run: pytest tests/ --ignore=tests/test_live.py -v

  live:
    name: live browser tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download Chromium locally
        env:
          CHROMEBROWSE_BROWSERS_DIR: ${{ github.workspace }}/.browsers
        run: chromebrowse install --dir .browsers

      - name: Run live tests
        env:
          CHROMEBROWSE_LIVE: "1"
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
        run: pytest tests/test_live.py -v

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Validate distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Install wheel and smoke-test installed package
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -m chromebrowse --version
          python -c "import chromebrowse; from chromebrowse import Browser, BrowserConfig, Session; print('Imported package from:', chromebrowse.__file__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
